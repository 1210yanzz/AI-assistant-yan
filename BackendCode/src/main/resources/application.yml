spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_mental_health_assistant?useSSL=false&serverTimezone= UTC
    username: root
    password: 20041210
  ai:
    openai:
      # DeepSeek 使用 OpenAI 兼容接口，密钥通过环境变量 DEEPSEEK_API_KEY 注入
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/v1
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
  # 文章封面最大 5MB，与前端和后端校验保持一致
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# 阿里云 OSS 配置：AccessKey 通过环境变量注入，不要写入配置文件
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  bucket: ${OSS_BUCKET:java-yzz-web}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

# 服务器配置
server:
  port: 8080

# jwt配置
jwt:
  secret: jwtSecret-keyFor2026   # jwt密钥，用于签名和验证token
  expiration: 86400000   # token有效期：24小时（毫秒）
  refresh-expiration: 604800000   # refresh_token有效期：7天（毫秒）
  token-prefix: "Bearer"   # token前缀
  header: Authorization   # header名称
  token-type: "JWT"   # token类型

